<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>9/F'nin Bahçesi 🌱</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;1,6..12,600&display=swap" rel="stylesheet">

<style>
  /* Tema 12:00'ye (gündüz) sabitlendi — tüm renkler sabit */
  :root{
    --sky-top:#dff3ea;
    --sky-mid:#cfe9f7;
    --sky-bottom:#eaf6f0;
    --aura:rgba(168,220,192,.5);
    --hill1:#8fc79a;
    --hill2:#c9e6cf;
    --cam:rgba(255,255,255,.85);
    --cam-soft:rgba(255,255,255,.72);
    --kenar:rgba(255,255,255,.9);
    --golge:rgba(30,60,40,.16);
    --cizgi:rgba(60,80,70,.18);

    --leaf-deep:#2f6b45;
    --leaf:#3f8a5b;
    --leaf-light:#8fc79a;
    --clay:#a8622f;
    --clay-dark:#7c4620;
    --water:#2f86c9;
    --amber:#dd9c28;
    --danger:#c0392b;
    --ink:#20302a;
    --ink-soft:#4d6058;
    --paper:#fbfaf6;
    --gold:#c9962f;
  }

  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    overflow:hidden;
    background:
      radial-gradient(120% 68% at 76% 14%, var(--aura) 0%, rgba(0,0,0,0) 62%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 56%, var(--sky-bottom) 100%);
    font-family:'Nunito Sans', sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,.display{ font-family:'Fredoka', sans-serif; }

  #stage{
    height:100dvh;
    width:100vw;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding: clamp(14px,4vh,34px) clamp(14px,4vw,32px) clamp(8px,2.6vh,22px);
    position:relative;
  }
  #stage.titre{ animation:titre .5s linear; }
  @keyframes titre{
    0%,100%{ transform:translate(0,0); }
    10%{ transform:translate(-9px,6px); }
    25%{ transform:translate(8px,-7px); }
    40%{ transform:translate(-7px,-5px); }
    55%{ transform:translate(6px,6px); }
    70%{ transform:translate(-4px,3px); }
    85%{ transform:translate(3px,-2px); }
  }

  .hill{
    position:absolute; bottom:0; left:0; right:0; height:22vh;
    background:var(--hill1);
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
    transform:scale(1.6,1); opacity:.5; z-index:0;
  }
  .hill.back{ height:16vh; background:var(--hill2); transform:scale(1.9,1) translateY(6%); opacity:.55; }

  header{ text-align:center; z-index:2; margin-top:2px; }
  header h1{
    font-size:clamp(1.2rem,4.2vw,1.7rem); font-weight:600;
    color:var(--leaf-deep); margin:0 0 2px 0;
  }
  header p{ margin:0; font-size:clamp(.7rem,2.2vw,.85rem); color:var(--ink-soft); }
  #aliveDays{
    display:inline-block; margin-top:6px;
    background:var(--cam-soft); border-radius:999px;
    padding:4px 12px; font-size:.75rem; font-weight:700; color:var(--leaf-deep);
  }

  #plantArea{
    flex:1; width:100%; max-width:420px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; z-index:2; min-height:0;
  }
  #plantWrap{
    position:relative; display:flex; flex-direction:column;
    align-items:center; justify-content:flex-end;
    height:min(34vh,270px);
    width:200px;
  }

  #plantEmoji{
    font-size:clamp(3.4rem,15vh,7rem); line-height:1;
    filter:drop-shadow(0 10px 14px rgba(30,60,40,.18));
    transform-origin:bottom center;
    animation: sway 4.5s ease-in-out infinite;
  }
  @keyframes sway{ 0%,100%{transform:rotate(-3deg);} 50%{transform:rotate(3deg);} }

  .pot{
    width:clamp(74px,19vh,116px); height:clamp(44px,11vh,66px);
    background:linear-gradient(160deg, var(--clay) 0%, var(--clay-dark) 100%);
    border-radius:8px 8px 22px 22px / 8px 8px 30px 30px;
    margin-top:-6px; position:relative;
    box-shadow:inset 0 -6px 10px rgba(0,0,0,.18), 0 6px 10px rgba(30,20,10,.15);
  }
  .pot::before{
    content:''; position:absolute; top:-8px; left:-6%; width:112%; height:14px;
    background:var(--clay); border-radius:6px;
  }

  #waterBarOuter{
    width:100%; max-width:300px; height:18px;
    background:var(--cam-soft); border:2px solid var(--kenar); border-radius:999px;
    box-shadow:0 2px 6px rgba(30,60,40,.12), inset 0 1px 2px rgba(0,0,0,.06);
    overflow:hidden; margin-top:12px;
  }
  #waterBarFill{
    height:100%; width:87%; border-radius:999px;
    background:linear-gradient(90deg, var(--water) 0%, #4fb0e0 100%);
  }
  #waterPct{ font-size:.76rem; color:var(--ink-soft); margin-top:4px; font-weight:600; }

  #statusLine{ margin-top:10px; text-align:center; min-height:2.2em; }
  #statusLine .title{ font-family:'Fredoka',sans-serif; font-size:clamp(1rem,3.4vw,1.25rem); font-weight:600; color:var(--leaf-deep); }
  #statusLine .sub{ font-size:.76rem; color:var(--ink-soft); margin-top:2px; }

  #infoCard{
    width:100%; max-width:340px;
    background:var(--cam-soft); backdrop-filter:blur(6px);
    box-shadow:0 4px 14px var(--golge);
    border-radius:18px; padding:8px 16px; margin-top:8px; z-index:2; font-size:.78rem;
  }
  #infoCard .row{ display:flex; justify-content:space-between; padding:3px 0; }
  #infoCard .row + .row{ border-top:1px dashed var(--cizgi); }
  #infoCard .label{ color:var(--ink-soft); }
  #infoCard .value{ font-weight:700; color:var(--leaf-deep); text-align:right; }

  #waterBtn{
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:clamp(.95rem,3.4vw,1.1rem);
    color:#fff; background:linear-gradient(160deg, var(--water) 0%, #1f6fa8 100%);
    border:none; padding:13px 30px; border-radius:999px;
    box-shadow:0 6px 0 #17547e, 0 10px 18px rgba(20,60,90,.25);
    cursor:pointer; margin: clamp(8px,2vh,14px) 0 2px 0;
    transition:transform .12s ease, box-shadow .12s ease;
    z-index:2; user-select:none; touch-action:manipulation;
  }
  #waterBtn:active{ transform:translateY(5px); box-shadow:0 1px 0 #17547e, 0 4px 10px rgba(20,60,90,.2); }

  /* --- onay modalı --- */
  .modalOverlay{
    position:fixed; inset:0; background:rgba(20,35,28,.55);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modalOverlay.hidden{ display:none; }
  .modalCard{
    background:var(--paper); border-radius:22px; padding:22px 22px;
    max-width:340px; width:100%; text-align:center;
    box-shadow:0 20px 44px var(--golge);
  }
  .modalCard .soru{
    font-family:'Fredoka',sans-serif; font-weight:500; font-size:1.05rem;
    line-height:1.45; color:var(--ink); margin:6px 0 18px 0;
  }
  .evetSatir{ display:flex; gap:10px; }
  .primaryBtn{
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:1rem; color:#fff;
    background:linear-gradient(160deg, var(--leaf) 0%, var(--leaf-deep) 100%);
    border:none; padding:12px; border-radius:12px; cursor:pointer;
    flex:1; touch-action:manipulation;
  }
  .primaryBtn:active{ transform:scale(.97); }

  /* =========================================================
     BOMBA + PATLAMA
     ========================================================= */
  .bomba{
    position:fixed; left:0; top:0; z-index:100; pointer-events:none;
    font-size:3.4rem; line-height:1; will-change:transform;
    filter:drop-shadow(0 8px 8px rgba(0,0,0,.3));
  }

  .flas{
    position:fixed; inset:0; z-index:85; pointer-events:none;
    background:#fff; opacity:0; animation:flas .55s ease-out forwards;
  }
  @keyframes flas{ 0%{opacity:.95;} 100%{opacity:0;} }

  .patlama{ position:fixed; z-index:90; width:0; height:0; pointer-events:none; }
  .patlama > *{ position:absolute; pointer-events:none; }

  .ates{
    left:-55px; top:-55px; width:110px; height:110px; border-radius:50%;
    background:radial-gradient(circle,#fff 0%,#ffe27a 24%,#ff9a1f 50%,#e8431a 72%,rgba(232,67,26,0) 100%);
    animation:atesBuyu 1.1s ease-out forwards;
  }
  @keyframes atesBuyu{
    0%{ transform:scale(.1); opacity:1; }
    35%{ transform:scale(2.3); opacity:1; }
    100%{ transform:scale(3.8); opacity:0; }
  }
  .halka{
    left:-50px; top:-50px; width:100px; height:100px; border-radius:50%;
    border:6px solid rgba(255,235,170,.95);
    animation:halkaYay .85s ease-out forwards;
  }
  @keyframes halkaYay{
    0%{ transform:scale(.2); opacity:1; }
    100%{ transform:scale(4.6); opacity:0; }
  }
  .patlamaEmoji{
    left:0; top:0; font-size:5.5rem; line-height:1;
    animation:emojiPat .95s ease-out forwards;
  }
  @keyframes emojiPat{
    0%{ transform:translate(-50%,-50%) scale(.2); opacity:1; }
    40%{ transform:translate(-50%,-50%) scale(1.3); opacity:1; }
    100%{ transform:translate(-50%,-50%) scale(1.8); opacity:0; }
  }
  .parca{
    left:0; top:0; border-radius:2px;
    animation:parcaUc 1.25s cubic-bezier(.15,.7,.3,1) forwards;
  }
  .petal{ line-height:1; }
  @keyframes parcaUc{
    0%{ transform:translate(-50%,-50%) rotate(0) scale(1); opacity:1; }
    45%{ transform:translate(calc(-50% + var(--dx)*.75), calc(-50% + var(--dy)*.75 - 34px)) rotate(calc(var(--rot)*.5)) scale(1); opacity:1; }
    100%{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy) + 90px)) rotate(var(--rot)) scale(.6); opacity:0; }
  }
  .duman{
    left:-30px; top:-30px; width:60px; height:60px; border-radius:50%;
    background:rgba(70,70,70,.55); filter:blur(7px);
    animation:dumanCik 1.4s ease-out forwards; opacity:0;
  }
  @keyframes dumanCik{
    0%{ transform:translate(0,0) scale(.4); opacity:0; }
    20%{ opacity:.7; }
    100%{ transform:translate(var(--sx),-70px) scale(2.4); opacity:0; }
  }

  /* =========================================================
     MEKTUP
     ========================================================= */
  .mektupKap{
    position:fixed; z-index:200; width:150px; height:100px; margin-left:-75px;
    animation:mektupYuz 2.4s ease-in-out .9s infinite;
  }
  .mektupKap.acik, .mektupKap.animYok{ animation:none; }
  .mektupKap.animYok .mektup{ animation:none; }
  .mektupOlcek{
    width:150px; height:100px;
    transform:scale(var(--s,1)); transform-origin:50% 100%;
  }
  @keyframes mektupYuz{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }

  .mektup{
    position:relative; width:100%; height:100%; cursor:pointer; isolation:isolate;
    animation:mektupBelir .75s cubic-bezier(.2,1.4,.4,1) backwards;
    transition:transform .2s ease; outline:none;
  }
  .mektup:not(.open):hover{ transform:scale(1.05); }
  @keyframes mektupBelir{
    0%{ transform:scale(0) rotate(-18deg); opacity:0; }
    100%{ transform:scale(1) rotate(0); opacity:1; }
  }
  .mArka{
    position:absolute; inset:0; background:#cfa66f; border-radius:6px;
    box-shadow:0 10px 18px rgba(40,30,10,.28);
  }
  .mKagit{
    position:absolute; left:10px; right:10px; bottom:8px; height:84px; z-index:2;
    background:#fffdf6; border-radius:4px; padding:8px;
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-family:'Fredoka',sans-serif; font-weight:500; font-size:.7rem; line-height:1.35; color:#3b3226;
    box-shadow:0 1px 5px rgba(0,0,0,.18);
    transform-origin:center bottom;
    transition:transform .8s cubic-bezier(.3,1,.4,1), z-index 0s;
  }
  .mOn{
    position:absolute; inset:0; z-index:3; border-radius:6px;
    background:linear-gradient(135deg,#efd7aa,#dcbb86);
    clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);
  }
  .mKapak{
    position:absolute; left:0; top:0; width:100%; height:58px; z-index:4;
    background:linear-gradient(180deg,#e7c896,#d2ac74);
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:top center;
    transform:perspective(600px) rotateX(0deg);
    transition:transform .6s ease, z-index 0s;
  }
  .mMuhur{
    position:absolute; left:50%; top:46px; width:24px; height:24px; margin-left:-12px; z-index:5;
    border-radius:50%; background:radial-gradient(circle at 35% 30%,#ea5a4c,#a02a1f);
    box-shadow:0 2px 4px rgba(0,0,0,.3); transition:opacity .3s ease;
    display:grid; place-items:center; font-size:.7rem; color:#ffd9d4; line-height:1;
  }
  .mektup.open .mKapak{ transform:perspective(600px) rotateX(180deg); z-index:1; transition:transform .6s ease, z-index 0s .3s; }
  .mektup.open .mMuhur{ opacity:0; }
  .mektup.open .mKagit{
    transform:translateY(-88px); z-index:6;
    transition:transform .7s cubic-bezier(.3,1,.4,1), z-index 0s .4s; /* katman geçişi yükselişin ortasında, çakışma yokken */
  }
  .mektup.open.out .mKagit{
    transform:translateY(-88px) scale(1.95);
    transition:transform .8s cubic-bezier(.3,1,.4,1), z-index 0s;
  }
  .mektup.open{ cursor:default; }
  .arayuzGizli{ visibility:hidden !important; }
</style>
</head>
<body>

<div id="stage">
  <div class="hill back"></div>
  <div class="hill"></div>

  <header>
    <h1>9/F'nin Bahçesi 🌱</h1>
    <p>Hep birlikte bir bitkiyi hayatta tutuyoruz</p>
    <div id="aliveDays">🌞 Hayatta: 0 gün</div>
  </header>

  <div id="plantArea">
    <div id="plantWrap">
      <div id="plantEmoji">🌸</div>
      <div class="pot"></div>
    </div>

    <div id="waterBarOuter"><div id="waterBarFill"></div></div>
    <div id="waterPct">%87 su seviyesi</div>

    <div id="statusLine">
      <div class="title">Bitki mis gibi 🌿</div>
      <div class="sub">Her şey yolunda</div>
    </div>
  </div>

  <div id="infoCard">
    <div class="row"><span class="label">En son sulayan</span><span class="value">—</span></div>
    <div class="row"><span class="label">Sulama zamanı</span><span class="value">12:00</span></div>
    <div class="row"><span class="label">Toplam sulama</span><span class="value">0</span></div>
  </div>

  <button id="waterBtn">???</button>
</div>

<!-- onay modalı -->
<div id="confirmModal" class="modalOverlay hidden">
  <div class="modalCard">
    <p class="soru">bunu yapmak istediğine eminmisin bu işlem geri alınamaz.</p>
    <div class="evetSatir">
      <button class="primaryBtn evetBtn" type="button">Evet</button>
      <button class="primaryBtn evetBtn" type="button">Evet</button>
    </div>
  </div>
</div>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  let basladi = false;

  /* ---------- Buton -> onay modalı ---------- */
  $("waterBtn").addEventListener("click", () => {
    if(basladi) return;
    $("confirmModal").classList.remove("hidden");
  });
  document.querySelectorAll(".evetBtn").forEach((b) => b.addEventListener("click", sureciBaslat));

  /* ---------- "Evet" -> olay akışı ---------- */
  function sureciBaslat(){
    if(basladi) return;
    basladi = true;

    $("confirmModal").classList.add("hidden");
    // düzen kaymasın diye display değil visibility ile gizliyoruz
    $("waterBtn").style.visibility = "hidden";
    $("waterBtn").style.pointerEvents = "none";

    const r = $("plantWrap").getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height * 0.6;

    bombaDus(cx, cy, () => patlat(cx, cy));
  }

  /* saksı + çiçek + arayüz gizlenir (visibility: yerleşim kaymasın) */
  function herseyiGizle(){
    $("plantEmoji").style.visibility = "hidden";
    document.querySelector(".pot").style.visibility = "hidden";
    ["waterBarOuter","waterPct","statusLine","infoCard","aliveDays"].forEach((id) => $(id).classList.add("arayuzGizli"));
  }

  function bombaDus(cx, cy, bitince){
    const b = document.createElement("div");
    b.className = "bomba";
    b.textContent = "💣";
    document.body.appendChild(b);

    const anim = b.animate([
      { transform:`translate(${cx}px, -90px) translate(-50%,-50%) rotate(-25deg)` },
      { transform:`translate(${cx}px, ${cy}px) translate(-50%,-50%) rotate(20deg)` }
    ], { duration: 1100, easing: "cubic-bezier(.55,0,.95,.55)", fill: "forwards" });

    anim.onfinish = () => { b.remove(); bitince(); };
  }

  function patlat(cx, cy){
    // saksı, çiçek ve tüm arayüz PATLAMA ANINDA yok olur
    herseyiGizle();

    // ekran sarsıntısı + flaş
    const stage = $("stage");
    stage.classList.add("titre");
    setTimeout(() => stage.classList.remove("titre"), 520);
    const flas = document.createElement("div");
    flas.className = "flas";
    document.body.appendChild(flas);

    const kutu = document.createElement("div");
    kutu.className = "patlama";
    kutu.style.left = cx + "px";
    kutu.style.top = cy + "px";

    const ekle = (cls, metin) => {
      const d = document.createElement("div");
      d.className = cls;
      if(metin) d.textContent = metin;
      kutu.appendChild(d);
      return d;
    };

    ekle("ates");
    ekle("halka");
    ekle("patlamaEmoji", "💥");

    // duman
    for(let i = 0; i < 5; i++){
      const d = ekle("duman");
      d.style.setProperty("--sx", ((Math.random() - .5) * 90) + "px");
      d.style.animationDelay = (.1 + i * .06) + "s";
    }

    // saksı kırıkları + yaprak/çiçek parçaları
    const renkler = ["#a8622f","#7c4620","#c47a43","#5a3216"];
    for(let i = 0; i < 16; i++){
      const d = ekle("parca");
      const aci = Math.random() * Math.PI * 2;
      const mesafe = 70 + Math.random() * 120;
      const boyut = 7 + Math.random() * 9;
      d.style.width = boyut + "px";
      d.style.height = boyut * (.6 + Math.random() * .5) + "px";
      d.style.background = renkler[i % renkler.length];
      d.style.setProperty("--dx", (Math.cos(aci) * mesafe) + "px");
      d.style.setProperty("--dy", (Math.sin(aci) * mesafe * .8) + "px");
      d.style.setProperty("--rot", ((Math.random() - .5) * 900) + "deg");
    }
    const parcalar = ["🌸","🌿","🍃","🌸"];
    for(let i = 0; i < 8; i++){
      const d = ekle("parca petal", parcalar[i % parcalar.length]);
      const aci = Math.random() * Math.PI * 2;
      const mesafe = 60 + Math.random() * 130;
      d.style.fontSize = (1 + Math.random() * .7) + "rem";
      d.style.setProperty("--dx", (Math.cos(aci) * mesafe) + "px");
      d.style.setProperty("--dy", (Math.sin(aci) * mesafe * .8) + "px");
      d.style.setProperty("--rot", ((Math.random() - .5) * 600) + "deg");
    }

    document.body.appendChild(kutu);

    // patlama efekti ~1.5 sn sonra kaybolur, ardından mektup belirir
    setTimeout(() => {
      kutu.remove();
      flas.remove();
      mektupGoster(true);
    }, 1500);
  }

  /* ---------- Mektup ---------- */
  const KAYIT_ANAHTARI = "bahceMektupAcildi";
  function kayitliMi(){
    try{ return localStorage.getItem(KAYIT_ANAHTARI) === "1"; }catch(e){ return false; }
  }
  function kaydet(){
    try{ localStorage.setItem(KAYIT_ANAHTARI, "1"); }catch(e){}
  }

  function mektupGoster(animasyonlu){
    const kap = document.createElement("div");
    kap.className = "mektupKap" + (animasyonlu ? "" : " animYok");
    kap.innerHTML =
      '<div class="mektupOlcek">' +
        '<div class="mektup" role="button" tabindex="0" aria-label="Mektubu aç">' +
          '<div class="mArka"></div>' +
          '<div class="mKagit"><span></span></div>' +
          '<div class="mOn"></div>' +
          '<div class="mKapak"></div>' +
          '<div class="mMuhur">♥</div>' +
        '</div>' +
      '</div>';
    kap.querySelector(".mKagit span").textContent = "Şu oyunu sal artık.";

    // konum + ekrana göre ölçek: açık kâğıt (~253px * ölçek geniş, ~262px * ölçek yüksek) taşmasın
    const konumla = () => {
      const r = $("plantWrap").getBoundingClientRect();
      const altY = r.bottom - r.height * 0.08;                 // zarfın alt kenarı
      const s = Math.max(.55, Math.min(
        1.4,                                                   // masaüstü üst sınırı
        (window.innerWidth * 0.92) / 253,                      // genişlik
        (altY - 12) / 262                                      // üstten taşma
      ));
      kap.style.setProperty("--s", s.toFixed(3));
      kap.style.left = (r.left + r.width / 2) + "px";
      kap.style.top  = (altY - 100) + "px";
    };
    konumla();
    window.addEventListener("resize", konumla);
    window.addEventListener("load", konumla);
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(konumla);
    document.body.appendChild(kap); // en üst katman

    const mektup = kap.querySelector(".mektup");
    let acildi = false;
    const ac = () => {
      if(acildi) return;
      acildi = true;
      kaydet();                                                // açıldığı localStorage'a yazılır
      kap.classList.add("acik");
      mektup.classList.add("open");                            // kapak açılır, kâğıt yükselir
      setTimeout(() => mektup.classList.add("out"), 650);      // kâğıt büyür
    };
    mektup.addEventListener("click", ac);
    mektup.addEventListener("keydown", (e) => {
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); ac(); }
    });
  }

  /* ---------- Açılışta: kayıt varsa animasyonsuz, doğrudan patlama sonrası hal ---------- */
  if(kayitliMi()){
    basladi = true;
    $("waterBtn").style.visibility = "hidden";
    $("waterBtn").style.pointerEvents = "none";
    herseyiGizle();
    mektupGoster(false);
  }
})();
</script>
</body>
</html>
