<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF1D6">
<title>9/F 'nin Galerisi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FFF4DE; --cream-2:#FFE9C2; --paper:#FFFCF5; --cocoa:#6A4A48; --cocoa-2:#9C7D76; --line:#F0D9B5;
  --pink:#FFB3C9; --pink-d:#F08CAA; --mint:#9BE3C0; --sky:#92D4F7; --butter:#FFD966; --lav:#C9B3FF; --peach:#FFC49B;
  --r:16px;
  --shadow:0 5px 0 rgba(222,176,120,.38), 0 12px 24px rgba(180,120,80,.14);
  --font-d:'Fredoka','Nunito',ui-rounded,'Segoe UI',system-ui,sans-serif;
  --font-b:'Nunito','Fredoka',ui-rounded,'Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font-b); color:var(--cocoa); overflow:hidden; overscroll-behavior:none;
  background:
    radial-gradient(circle at 1px 1px, rgba(255,170,130,.20) 2px, transparent 2.6px) 0 0/28px 28px,
    radial-gradient(560px 380px at 6% 0%, rgba(255,158,187,.38), transparent 70%),
    radial-gradient(620px 440px at 100% 100%, rgba(146,212,247,.45), transparent 70%),
    var(--cream);
  /* Mobil engelleri */
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
}
input{-webkit-user-select:text; user-select:text; -webkit-touch-callout:default}
button{font-family:inherit; color:inherit; touch-action:manipulation; -webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--sky); outline-offset:2px}

#app{
  height:100dvh; display:grid; gap:14px; padding:14px;
  padding-top:max(14px, env(safe-area-inset-top)); padding-bottom:max(14px, env(safe-area-inset-bottom));
  grid-template-columns:112px minmax(0,1fr) 320px;
  grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"top top top" "pal stage side";
}
.card{background:var(--paper); border:3px solid #fff; border-radius:var(--r); box-shadow:var(--shadow)}

/* ---------- Üst bar ---------- */
.topbar{grid-area:top; display:flex; align-items:center; justify-content:space-between; gap:12px}
.brand{display:flex; align-items:center; gap:12px; min-width:0}
.brand-ico{width:48px; height:48px; flex:none; display:grid; place-items:center; font-size:26px; border-radius:var(--r);
  background:var(--butter); box-shadow:0 4px 0 #EDBE3E; transform:rotate(-6deg)}
.brand h1{margin:0; font:700 clamp(19px,2.4vw,28px)/1.1 var(--font-d); letter-spacing:.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.brand small{display:flex; align-items:center; gap:6px; font:700 12px var(--font-b); color:var(--cocoa-2)}
.dot{width:9px; height:9px; border-radius:50%; background:#F3B0A0; transition:background .3s}
.dot.on{background:#5CCB8C; box-shadow:0 0 0 4px rgba(92,203,140,.25)}
.top-right{display:flex; align-items:center; gap:10px; flex:none}
.bump{animation:bump .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.btn-lb{display:none; width:46px; height:46px; border:3px solid #fff; border-radius:var(--r); background:var(--paper); box-shadow:var(--shadow); font-size:22px; cursor:pointer}

/* ---------- Palet ---------- */
.palette{grid-area:pal; padding:16px 8px; display:flex; flex-direction:column; align-items:center; gap:18px; overflow-y:auto; overflow-x:hidden; scrollbar-width:none}
.palette::-webkit-scrollbar{display:none}
.swatch{
  --c:#ccc; position:relative; flex:none; width:62px; height:62px; border:0; border-radius:var(--r); cursor:pointer;
  background:var(--c); color:var(--fg,#3B2A28); text-shadow:0 1px 2px var(--fgs,rgba(255,255,255,.8)), 0 0 4px var(--fgs,rgba(255,255,255,.8)); font:700 26px var(--font-d);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.10), inset 0 4px 0 rgba(255,255,255,.45), 0 4px 0 rgba(150,100,70,.22);
  transition:transform .22s cubic-bezier(.3,1.7,.5,1), box-shadow .22s;
}
.swatch .left{position:absolute; left:50%; bottom:-9px; transform:translateX(-50%); padding:1px 8px; border-radius:999px; background:var(--paper);
  font:700 11px var(--font-b); color:var(--cocoa-2); text-shadow:none; box-shadow:0 2px 0 rgba(150,100,70,.2)}
.swatch.sel{transform:scale(1.16) rotate(-4deg);
  box-shadow:0 0 0 4px var(--paper), 0 0 0 7px var(--c), 0 0 26px 8px color-mix(in srgb, var(--c) 65%, transparent)}
.swatch.gone{display:none !important}

/* ---------- Sahne / tuval ---------- */
.stage{grid-area:stage; position:relative; overflow:hidden; border-radius:var(--r); border:3px solid #fff; box-shadow:var(--shadow);
  background:radial-gradient(circle at 1px 1px, rgba(255,160,120,.18) 1.6px, transparent 2px) 0 0/22px 22px, linear-gradient(160deg,#FFF1D8,#FFE6EA)}
#board{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair}
.stage.pan-mode #board{cursor:grab}
.stage.panning #board{cursor:grabbing}
.tools{position:absolute; right:12px; bottom:12px; display:flex; flex-direction:column; gap:10px; z-index:5}
.tbtn{width:48px; height:48px; border:0; border-radius:var(--r); background:var(--paper); font-size:22px; cursor:pointer; line-height:1;
  box-shadow:0 4px 0 rgba(222,176,120,.5), 0 8px 14px rgba(180,120,80,.15); transition:transform .12s, box-shadow .12s, background .2s}
.tbtn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(222,176,120,.5)}
.tbtn.on{background:var(--butter); box-shadow:0 4px 0 #EDBE3E, 0 8px 14px rgba(180,120,80,.15)}
.pill{position:absolute; left:12px; bottom:12px; z-index:5; padding:7px 14px; border-radius:999px; background:var(--paper); font:600 14px var(--font-d);
  box-shadow:0 4px 0 rgba(222,176,120,.5)}
.bubble{--tx:0px; position:absolute; z-index:6; pointer-events:none; padding:8px 14px; border-radius:var(--r); background:#fff; white-space:nowrap;
  font:700 13px var(--font-b); box-shadow:0 4px 0 rgba(222,176,120,.5), 0 12px 20px rgba(120,80,60,.2);
  transform:translate(-50%,-100%) scale(.5); transform-origin:50% 100%; opacity:0; transition:opacity .15s, transform .28s cubic-bezier(.3,1.7,.5,1); display:flex; align-items:center; gap:8px}
.bubble::after{content:''; position:absolute; left:calc(50% + var(--tx)); bottom:-6px; width:13px; height:13px; background:#fff; border-radius:3px; transform:translateX(-50%) rotate(45deg)}
.bubble.show{opacity:1; transform:translate(-50%,calc(-100% - 8px)) scale(1)}
.bubble i{width:14px; height:14px; border-radius:5px; background:var(--pink); box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.banner{position:absolute; top:58px; left:50%; z-index:7; width:max-content; max-width:calc(100% - 24px); display:flex; align-items:center; gap:12px; padding:12px 18px;
  border-radius:var(--r); background:#FFF0F3; border:3px solid #fff; box-shadow:0 5px 0 rgba(240,140,170,.45), 0 14px 24px rgba(180,100,100,.18);
  transform:translate(-50%,-160%); opacity:0; pointer-events:none; transition:transform .5s cubic-bezier(.3,1.5,.5,1), opacity .3s}
.banner.show{transform:translate(-50%,0); opacity:1}
.banner .b-emoji{font-size:30px}
.banner b{display:block; font:700 17px var(--font-d)}
.banner span{font-size:13px; font-weight:700; color:var(--cocoa-2)}
.banner i{font-style:normal; color:var(--cocoa); font-family:var(--font-d)}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.banner.shake{animation:none}
.banner.show.shake{animation:bshake .45s}
@keyframes bshake{20%{transform:translate(calc(-50% - 7px),0)}40%{transform:translate(calc(-50% + 7px),0)}60%{transform:translate(calc(-50% - 4px),0)}80%{transform:translate(calc(-50% + 4px),0)}}

/* ---------- Yan panel ---------- */
.side{grid-area:side; display:flex; flex-direction:column; gap:14px; min-height:0}
.bucket-card{display:flex; align-items:center; gap:14px; padding:12px 16px 12px 10px}
.bucket-svg{width:96px; height:106px; flex:none; overflow:visible}
.bucket-svg .wave{animation:slosh 2.4s linear infinite}
.bucket-svg .wave2{animation:slosh 3.4s linear infinite reverse}
@keyframes slosh{to{transform:translateX(-60px)}}
#liq{transition:transform .6s cubic-bezier(.3,1.3,.5,1)}
.liqfill{fill:var(--liq,#FFA6C1); transition:fill .4s}
#faceSad{display:none}
.bucket-card.empty #faceSad{display:inline}
.bucket-card.empty #faceHappy{display:none}
.b-info{min-width:0}
.b-info h2{margin:0 0 2px; font:600 14px var(--font-b); color:var(--cocoa-2)}
.b-info .big{font:700 20px var(--font-d)}
.b-info .big b{font-size:26px}
.b-info .sub{margin-top:4px; font:700 13px var(--font-b); color:var(--cocoa-2)}
.lb-card{flex:1; min-height:0; display:flex; flex-direction:column; padding:14px 12px 12px}
.lb-head{display:flex; align-items:center; justify-content:space-between; padding:0 6px 10px}
.lb-head h2{margin:0; font:700 20px var(--font-d)}
.lb-close{display:none; border:0; background:#FFF0D2; width:36px; height:36px; border-radius:12px; font-size:16px; cursor:pointer}
.lb-list{overflow-y:auto; display:flex; flex-direction:column; gap:7px; padding:2px 4px 6px; scrollbar-width:thin; scrollbar-color:#F0D3A8 transparent}
.row{display:grid; grid-template-columns:34px 38px minmax(0,1fr) auto; align-items:center; gap:8px; padding:8px 12px 8px 8px; border-radius:14px; background:#FFF6E6; flex:none}
.row.me{background:#FFE4EC; box-shadow:inset 0 0 0 2px var(--pink)}
.row.enter{animation:rowIn .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes rowIn{from{opacity:0; transform:scale(.8)}}
.row .rk{font:700 15px var(--font-d); text-align:center; color:var(--cocoa-2)}
.row .rk.medal{font-size:24px; line-height:1}
.row .av{position:relative; display:grid; place-items:center; width:34px; height:34px; border-radius:50%}
.row .av b{font:700 15px var(--font-d)}
.row .crown{display:none; position:absolute; top:-15px; left:50%; transform:translateX(-50%) rotate(-10deg); font-style:normal; font-size:17px}
.row.r1 .crown{display:block}
.row .nm{font:700 15px var(--font-b); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .sc{font:700 16px var(--font-d)}
.dots{flex:none; text-align:center; color:var(--cocoa-2); line-height:.6; font-weight:800}

/* ---------- Modal, toast ---------- */
.modal{position:fixed; inset:0; z-index:100; display:grid; place-items:center; padding:16px; background:rgba(255,226,196,.72); -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px)}
.modal[hidden]{display:none}
.m-card{width:min(420px,100%); padding:26px 24px 24px; text-align:center; animation:mpop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes mpop{from{opacity:0; transform:scale(.7) translateY(30px)}}
.mascot{display:inline-block; font-size:58px; animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
.m-card h2{margin:6px 0 4px; font:700 26px var(--font-d)}
.m-card p{margin:0 0 18px; color:var(--cocoa-2); font-weight:700}
.m-row{display:flex; gap:10px}
.m-row input{flex:1; min-width:0; padding:14px 16px; border-radius:var(--r); border:3px solid var(--line); background:#fff; font:700 17px var(--font-b); color:var(--cocoa); outline:none; transition:border-color .2s, box-shadow .2s}
.m-row input:focus{border-color:var(--pink); box-shadow:0 0 0 4px rgba(255,179,201,.4)}
.m-row input.bad{border-color:#FF8A8A; animation:shake .4s}
.btn{width:100%; margin-top:14px; padding:14px 22px; border:0; border-radius:var(--r); background:var(--pink); color:#5A3636; font:700 19px var(--font-d); cursor:pointer; box-shadow:0 5px 0 var(--pink-d)}
.btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--pink-d)}
.m-err{min-height:20px; margin-top:8px; font-size:13px; font-weight:800; color:#D8566B}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); z-index:750; max-width:calc(100% - 32px); padding:12px 20px; border-radius:var(--r); background:#fff; font:700 14px var(--font-b);
  box-shadow:0 5px 0 rgba(222,176,120,.5), 0 14px 26px rgba(120,80,60,.2); transform:translate(-50%,160%); transition:transform .45s cubic-bezier(.3,1.5,.5,1); pointer-events:none; text-align:center}
.toast.show{transform:translate(-50%,0)}
#confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:800}

.conn-modal{z-index:700; background:rgba(255,226,196,.92)}
.lock-modal{z-index:120; background:rgba(255,226,196,.9); touch-action:none}
.lock-modal .m-card h2{font-size:24px; line-height:1.25}
.lock-modal .m-card p{line-height:1.5}
.conn-modal .m-card h2{font-size:22px; line-height:1.25}
.conn-modal .m-card p{min-height:20px; word-break:break-word}
.conn-modal.loading .mascot{animation:spin 1.2s linear infinite}
.conn-modal.loading #btnRetry{display:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Mobil ---------- */
@media (max-width:819px){
  #app{gap:10px; padding:10px; padding-top:max(10px, env(safe-area-inset-top)); padding-bottom:max(10px, env(safe-area-inset-bottom));
    grid-template-columns:minmax(0,1fr); grid-template-rows:auto auto minmax(0,1fr) auto; grid-template-areas:"top" "pal" "stage" "dock"}
  .brand-ico{width:40px; height:40px; font-size:21px}
  .brand small{display:none}
  .btn-lb{display:grid; place-items:center; width:44px; height:44px}
  .palette{flex-direction:row; justify-content:flex-start; align-items:center; gap:16px; padding:16px 18px 20px; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x proximity}
  .swatch{width:54px; height:54px; font-size:23px}
  .side{display:contents}
  .bucket-card{grid-area:dock; padding:8px 14px 8px 6px; gap:10px}
  .bucket-svg{width:56px; height:62px}
  .b-info h2{display:none}
  .b-info .big{font-size:17px}
  .b-info .big b{font-size:20px}
  .b-info .sub{margin-top:0; font-size:12px}
  .tbtn{width:44px; height:44px; font-size:20px}
  .lb-card{position:fixed; left:10px; right:10px; bottom:max(10px, env(safe-area-inset-bottom)); z-index:60; max-height:62dvh; transform:translateY(130%); transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
  .lb-card.open{transform:none}
  .lb-close{display:block}
}


/* ---------- Müze butonu ---------- */
.btn-museum{display:flex; align-items:center; gap:8px; height:46px; padding:0 16px; border:3px solid #fff; border-radius:var(--r); background:var(--paper);
  box-shadow:var(--shadow); font:700 15px var(--font-d); cursor:pointer; white-space:nowrap}
.btn-museum .ico{font-size:20px; line-height:1}
.btn-museum.on{background:var(--butter); box-shadow:0 5px 0 #EDBE3E, 0 12px 24px rgba(180,120,80,.14)}
.btn-museum:active{transform:translateY(3px)}

/* ---------- Müze / Galeri ---------- */
.museum{position:fixed; inset:0; z-index:500; display:flex; flex-direction:column; min-height:0; min-width:0; overflow:hidden; color:#FFF4DE; padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  background:
    radial-gradient(900px 340px at 50% -90px, rgba(255,226,160,.42), transparent 70%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.22) 0 2px, rgba(255,255,255,.05) 2px 3px, transparent 3px 118px),
    repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0 1px, transparent 1px 5px),
    linear-gradient(180deg,#7A4B28,#5E3A20 55%,#4A2D18)}
.museum[hidden]{display:none}
#app.museum-open > :not(.museum){visibility:hidden}
#revealModal{z-index:550}
.mu-head{flex:none; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 18px; background:linear-gradient(180deg,rgba(0,0,0,.36),rgba(0,0,0,.16));
  border-bottom:3px solid rgba(0,0,0,.3); box-shadow:0 2px 0 rgba(255,220,160,.15)}
.mu-head h2{margin:0; font:700 clamp(18px,2.4vw,26px)/1.1 var(--font-d); color:#FFE9B8; text-shadow:0 2px 0 rgba(0,0,0,.4)}
.mu-head small{display:block; margin-top:3px; font:700 12px var(--font-b); color:#E8C99A; opacity:.9}
.mu-back{flex:none; border:0; cursor:pointer; padding:9px 16px; border-radius:12px; background:#FFE9B8; color:#5A3A20; font:700 15px var(--font-d); box-shadow:0 4px 0 #C9A25E}
.mu-back:active{transform:translateY(3px); box-shadow:0 1px 0 #C9A25E}
.gallery{flex:1; min-height:0; overflow-y:auto; padding:30px 24px 46px; display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:38px 28px; align-content:start;
  scrollbar-width:thin; scrollbar-color:#C9A25E transparent}
.mu-msg{grid-column:1 / -1; text-align:center; padding:70px 16px; font:700 19px/1.4 var(--font-d); color:#FFE9B8; text-shadow:0 2px 0 rgba(0,0,0,.35)}
.art{display:flex; flex-direction:column; gap:14px; border:0; background:none; padding:0; text-align:left; color:inherit; font:inherit; cursor:pointer; min-width:0;
  transition:transform .28s cubic-bezier(.3,1.6,.5,1)}
.art:hover, .art:focus-visible{transform:translateY(-7px) rotate(-.5deg)}
.art:active{transform:translateY(-2px) scale(.99)}
.frame{padding:13px; border-radius:6px; background:linear-gradient(135deg,#F0CD78,#B8872E 45%,#EBC56C 70%,#A87820); box-shadow:0 14px 22px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.28), inset 0 0 0 5px rgba(120,80,20,.25)}
.mat{padding:11px; background:#FFFCF5; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12), inset 0 3px 8px rgba(120,80,40,.22)}
.mat canvas{display:block; width:100%; aspect-ratio:1; image-rendering:pixelated; image-rendering:crisp-edges; background:#FFFDF7}
.plaque{align-self:center; width:calc(100% - 18px); padding:10px 14px 11px; border-radius:6px; text-align:center; color:#4B3320;
  background:linear-gradient(180deg,#F6E7BD,#DCC283); box-shadow:0 5px 0 rgba(50,28,10,.55), inset 0 0 0 2px rgba(255,255,255,.35)}
.a-title{margin:0 0 2px; font:700 18px/1.2 var(--font-d); word-break:break-word}
.a-artist{font:700 14px var(--font-b); word-break:break-word}
.a-date{margin-top:2px; font:700 12px var(--font-b); opacity:.75}
.a-top{margin-top:8px; padding-top:8px; border-top:2px dashed rgba(75,51,32,.3); display:flex; flex-direction:column; gap:3px; font:700 13px var(--font-b); text-align:left}
.a-top div{display:flex; justify-content:space-between; gap:8px}
.a-top span:first-child{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.a-top span:last-child{flex:none; opacity:.75}
.a-hint{margin-top:8px; font:700 12px var(--font-b); color:#8A5A2C}

/* ---------- Replay (time-lapse) modalı ---------- */
.replay{z-index:600; background:rgba(58,34,18,.78)}
.rp-card{position:relative; width:min(1000px,100%); max-height:calc(100dvh - 32px); overflow:auto; display:grid; grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr); gap:24px; padding:20px;
  animation:mpop .5s cubic-bezier(.3,1.6,.5,1); scrollbar-width:thin}
.rp-close{position:absolute; top:10px; right:10px; z-index:2; width:38px; height:38px; border:0; border-radius:12px; background:#FFF0D2; font-size:16px; cursor:pointer}
.rp-left{display:flex; flex-direction:column; gap:12px; min-width:0}
.rp-frame{padding:12px; border-radius:8px; background:linear-gradient(135deg,#F0CD78,#B8872E 45%,#EBC56C 70%,#A87820); box-shadow:0 10px 20px rgba(60,35,15,.35), inset 0 0 0 2px rgba(255,255,255,.28)}
.rp-stage{position:relative; background:#FFFDF7; box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.rp-stage canvas{display:block; width:100%; aspect-ratio:1}
.rp-ring{position:absolute; width:2%; height:2%; border:2px solid #6A4A48; border-radius:3px; pointer-events:none; box-shadow:0 0 0 2px rgba(255,255,255,.8)}
.rp-who{min-height:22px; text-align:center; font:700 14px var(--font-b); color:var(--cocoa-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rp-ctl{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.rp-btn{border:0; cursor:pointer; padding:10px 16px; border-radius:12px; background:var(--pink); color:#5A3636; font:700 15px var(--font-d); box-shadow:0 4px 0 var(--pink-d)}
.rp-btn.alt{background:var(--sky); box-shadow:0 4px 0 #62B4E0; padding:10px 14p
